apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: bayer-credit-analyst-agent

provides:
  apis:
    - name: bayer-credit-analyst-agent
      kind: a2a
      ordId: customer.build:apiResource:credit-analyst-8383e.bayer-credit-analyst-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
